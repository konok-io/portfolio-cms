<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design 10: Split/Two Column Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #f0fdfa;
            min-height: 100vh;
            padding: 60px 20px;
        }
        .pricing-section {
            max-width: 1200px;
            margin: 0 auto;
        }
        .left-content {
            padding-right: 50px;
        }
        .section-title {
            color: #0f172a;
            margin-bottom: 20px;
            font-weight: 800;
            font-size: 2.5rem;
        }
        .section-desc {
            color: #64748b;
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .billing-toggle {
            background: white;
            border-radius: 16px;
            padding: 20px 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            display: inline-flex;
            align-items: center;
            gap: 20px;
        }
        .billing-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .billing-option input {
            width: 18px;
            height: 18px;
            accent-color: #14b8a6;
        }
        .billing-label {
            font-weight: 600;
            color: #475569;
        }
        .save-badge {
            background: #d1fae5;
            color: #059669;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .pricing-card {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            padding: 35px 30px;
            height: 100%;
            transition: all 0.3s;
        }
        .pricing-card:hover {
            border-color: #14b8a6;
            box-shadow: 0 10px 40px rgba(20, 184, 166, 0.1);
        }
        .pricing-card.featured {
            background: linear-gradient(135deg, #14b8a6, #0d9488);
            border: none;
            color: white;
            position: relative;
            box-shadow: 0 25px 60px rgba(20, 184, 166, 0.3);
        }
        .icon-box {
            width: 50px;
            height: 50px;
            background: #ccfbf1;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            color: #0d9488;
            font-size: 1.3rem;
        }
        .featured .icon-box {
            background: rgba(255,255,255,0.2);
            color: white;
        }
        .plan-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 5px;
        }
        .featured .plan-name {
            color: white;
        }
        .plan-desc {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .featured .plan-desc {
            color: rgba(255,255,255,0.8);
        }
        .price {
            font-size: 3rem;
            font-weight: 900;
            color: #0f172a;
            line-height: 1;
            margin-bottom: 5px;
        }
        .featured .price {
            color: white;
        }
        .price-period {
            color: #64748b;
            font-size: 0.9rem;
        }
        .featured .price-period {
            color: rgba(255,255,255,0.8);
        }
        .features {
            list-style: none;
            padding: 0;
            margin: 25px 0 30px;
        }
        .features li {
            padding: 10px 0;
            color: #64748b;
            font-size: 0.9rem;
        }
        .featured .features li {
            color: rgba(255,255,255,0.9);
        }
        .btn-select {
            background: white;
            border: 2px solid #14b8a6;
            color: #14b8a6;
            padding: 14px;
            border-radius: 12px;
            width: 100%;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .btn-select:hover {
            background: #14b8a6;
            color: white;
        }
        .featured .btn-select {
            background: white;
            border: none;
            color: #14b8a6;
        }
        .featured .btn-select:hover {
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .badge-best {
            position: absolute;
            top: -14px;
            right: 25px;
            background: #fbbf24;
            color: #92400e;
            padding: 5px 16px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <section class="pricing-section">
        <div class="row align-items-center">
            <!-- Left Side -->
            <div class="col-lg-5 mb-5 mb-lg-0">
                <div class="left-content">
                    <h1 class="section-title">Simple, fair pricing</h1>
                    <p class="section-desc">Choose the plan that's right for you. All plans include a 14-day free trial.</p>
                    <div class="billing-toggle">
                        <label class="billing-option">
                            <input type="radio" name="billing" checked>
                            <span class="billing-label">Monthly</span>
                        </label>
                        <label class="billing-option">
                            <input type="radio" name="billing">
                            <span class="billing-label">Yearly</span>
                            <span class="save-badge">-20%</span>
                        </label>
                    </div>
                </div>
            </div>
            
            <!-- Right Side - Pricing Cards -->
            <div class="col-lg-7">
                <div class="row g-4">
                    <!-- Personal -->
                    <div class="col-md-6">
                        <div class="pricing-card">
                            <div class="icon-box">
                                <i class="fas fa-user"></i>
                            </div>
                            <h3 class="plan-name">Personal</h3>
                            <p class="plan-desc">For individuals</p>
                            <div class="price">$9<span style="font-size: 1rem; color: #64748b;">/mo</span></div>
                            <ul class="features">
                                <li><i class="fas fa-check text-teal-500 me-2"></i> 5 Projects</li>
                                <li><i class="fas fa-check text-teal-500 me-2"></i> Email Support</li>
                                <li><i class="fas fa-check text-teal-500 me-2"></i> 5GB Storage</li>
                            </ul>
                            <button class="btn-select">Start Trial</button>
                        </div>
                    </div>
                    
                    <!-- Team -->
                    <div class="col-md-6">
                        <div class="pricing-card featured">
                            <span class="badge-best">BEST</span>
                            <div class="icon-box">
                                <i class="fas fa-users"></i>
                            </div>
                            <h3 class="plan-name">Team</h3>
                            <p class="plan-desc">For teams</p>
                            <div class="price">$29<span style="font-size: 1rem; opacity: 0.8;">/mo</span></div>
                            <ul class="features">
                                <li><i class="fas fa-check me-2"></i> Unlimited Projects</li>
                                <li><i class="fas fa-check me-2"></i> Priority Support</li>
                                <li><i class="fas fa-check me-2"></i> 100GB Storage</li>
                            </ul>
                            <button class="btn-select">Start Trial</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
