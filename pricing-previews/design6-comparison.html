<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design 6: Pricing Table with Comparison</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: white;
            min-height: 100vh;
            padding: 60px 20px;
        }
        .pricing-section {
            max-width: 1000px;
            margin: 0 auto;
        }
        .section-title {
            text-align: center;
            color: #0f172a;
            margin-bottom: 10px;
            font-weight: 800;
            font-size: 2.5rem;
        }
        .section-subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 50px;
        }
        .pricing-table {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 50px rgba(0,0,0,0.08);
        }
        .table-header {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            background: #f8fafc;
        }
        .header-cell {
            padding: 30px 25px;
            text-align: center;
            border-bottom: 2px solid #e2e8f0;
        }
        .header-cell:first-child {
            text-align: left;
            display: flex;
            align-items: center;
            font-size: 1.25rem;
            font-weight: 700;
            color: #0f172a;
        }
        .header-cell.featured {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            position: relative;
        }
        .header-cell.featured::before {
            content: 'POPULAR';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            background: #fbbf24;
            color: #92400e;
            padding: 3px 15px;
            font-size: 0.65rem;
            font-weight: 700;
            border-radius: 0 0 8px 8px;
        }
        .plan-name {
            font-size: 1.1rem;
            font-weight: 700;
            margin-top: 15px;
        }
        .plan-price {
            font-size: 2.5rem;
            font-weight: 900;
            color: #0f172a;
        }
        .featured .plan-price {
            color: white;
        }
        .plan-period {
            font-size: 0.875rem;
            color: #64748b;
        }
        .featured .plan-period {
            color: rgba(255,255,255,0.8);
        }
        .table-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            border-bottom: 1px solid #f1f5f9;
        }
        .table-row:last-child {
            border-bottom: none;
        }
        .table-row:hover {
            background: #f8fafc;
        }
        .table-cell {
            padding: 20px 25px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #475569;
        }
        .table-cell:first-child {
            justify-content: flex-start;
            font-weight: 500;
        }
        .table-cell.featured {
            background: rgba(34, 197, 94, 0.03);
            color: #22c55e;
            font-weight: 600;
        }
        .btn-select {
            padding: 10px 25px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            background: #e2e8f0;
            color: #0f172a;
            transition: all 0.3s;
        }
        .btn-select:hover {
            background: #cbd5e1;
        }
        .btn-select.primary {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
        }
        .btn-select.primary:hover {
            box-shadow: 0 5px 20px rgba(34, 197, 94, 0.4);
        }
    </style>
</head>
<body>
    <section class="pricing-section">
        <h1 class="section-title">Choose Your Plan</h1>
        <p class="section-subtitle">All plans include a 30-day money-back guarantee</p>
        
        <div class="pricing-table">
            <!-- Header Row -->
            <div class="table-header">
                <div class="header-cell">Features</div>
                <div class="header-cell">
                    <span class="plan-name">Starter</span>
                    <div class="plan-price">$9</div>
                    <div class="plan-period">/month</div>
                </div>
                <div class="header-cell featured">
                    <span class="plan-name">Pro</span>
                    <div class="plan-price">$29</div>
                    <div class="plan-period">/month</div>
                </div>
                <div class="header-cell">
                    <span class="plan-name">Business</span>
                    <div class="plan-price">$79</div>
                    <div class="plan-period">/month</div>
                </div>
            </div>
            
            <!-- Projects Row -->
            <div class="table-row">
                <div class="table-cell">Projects</div>
                <div class="table-cell">5</div>
                <div class="table-cell featured">Unlimited</div>
                <div class="table-cell">Unlimited</div>
            </div>
            
            <!-- Storage Row -->
            <div class="table-row">
                <div class="table-cell">Storage</div>
                <div class="table-cell">5GB</div>
                <div class="table-cell featured">50GB</div>
                <div class="table-cell">Unlimited</div>
            </div>
            
            <!-- Support Row -->
            <div class="table-row">
                <div class="table-cell">Support</div>
                <div class="table-cell">Email</div>
                <div class="table-cell featured">24/7 Live</div>
                <div class="table-cell">Dedicated</div>
            </div>
            
            <!-- Analytics Row -->
            <div class="table-row">
                <div class="table-cell">Analytics</div>
                <div class="table-cell">Basic</div>
                <div class="table-cell featured">Advanced</div>
                <div class="table-cell">Custom</div>
            </div>
            
            <!-- API Access Row -->
            <div class="table-row">
                <div class="table-cell">API Access</div>
                <div class="table-cell"><i class="fas fa-times text-danger"></i></div>
                <div class="table-cell featured"><i class="fas fa-check text-success"></i></div>
                <div class="table-cell"><i class="fas fa-check text-success"></i></div>
            </div>
            
            <!-- Button Row -->
            <div class="table-row">
                <div class="table-cell"></div>
                <div class="table-cell"><button class="btn-select">Choose</button></div>
                <div class="table-cell featured"><button class="btn-select primary">Choose</button></div>
                <div class="table-cell"><button class="btn-select">Choose</button></div>
            </div>
        </div>
    </section>
</body>
</html>
