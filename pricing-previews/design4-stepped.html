<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design 4: Stepped/Accordion Style</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            padding: 60px 20px;
        }
        .pricing-section {
            max-width: 900px;
            margin: 0 auto;
        }
        .section-title {
            text-align: center;
            color: #0f172a;
            margin-bottom: 10px;
            font-weight: 800;
            font-size: 2.5rem;
        }
        .section-subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 50px;
        }
        .pricing-row {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 50px rgba(0,0,0,0.08);
        }
        .plan-row {
            padding: 35px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 25px;
            border-bottom: 1px solid #e2e8f0;
            transition: all 0.3s;
        }
        .plan-row:last-child {
            border-bottom: none;
        }
        .plan-row:hover {
            background: #f8fafc;
        }
        .plan-row.featured {
            background: linear-gradient(135deg, #0ea5e9, #06b6d4);
            border-bottom: none;
            color: white;
            position: relative;
        }
        .plan-row.featured::before {
            content: 'RECOMMENDED';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            background: #f59e0b;
            color: white;
            padding: 4px 20px;
            font-size: 0.7rem;
            font-weight: 700;
            border-radius: 0 0 10px 10px;
        }
        .plan-info {
            flex: 1;
            min-width: 200px;
        }
        .plan-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .badge-personal { background: #e0f2fe; color: #0284c7; }
        .badge-team { background: rgba(255,255,255,0.2); color: white; }
        .badge-business { background: #fef3c7; color: #d97706; }
        .plan-name {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .plan-price {
            font-size: 1.75rem;
            font-weight: 800;
        }
        .plan-period {
            font-size: 0.875rem;
            opacity: 0.7;
        }
        .plan-features {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }
        .plan-features span {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        .btn-select {
            padding: 12px 35px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
            border: none;
            background: #0f172a;
            color: white;
        }
        .btn-select:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .featured .btn-select {
            background: white;
            color: #0ea5e9;
        }
        .btn-outline {
            background: white;
            border: 2px solid #e2e8f0;
            color: #0f172a;
        }
    </style>
</head>
<body>
    <section class="pricing-section">
        <h1 class="section-title">Simple, Transparent Pricing</h1>
        <p class="section-subtitle">Choose the plan that fits your needs</p>
        
        <div class="pricing-row">
            <!-- Personal -->
            <div class="plan-row">
                <div class="plan-info">
                    <span class="plan-badge badge-personal">PERSONAL</span>
                    <div class="plan-name">$9/month</div>
                    <p style="color: #64748b; font-size: 0.875rem;">Essential features for individuals</p>
                </div>
                <div class="plan-features">
                    <span><i class="fas fa-check text-success me-1"></i> 5 Projects</span>
                    <span><i class="fas fa-check text-success me-1"></i> Basic Support</span>
                </div>
                <button class="btn-select btn-outline">Select</button>
            </div>
            
            <!-- Team -->
            <div class="plan-row featured" style="padding-top: 50px;">
                <div class="plan-info">
                    <span class="plan-badge badge-team">TEAM</span>
                    <div class="plan-name">$29/month</div>
                    <p style="opacity: 0.8; font-size: 0.875rem;">Everything your team needs</p>
                </div>
                <div class="plan-features">
                    <span><i class="fas fa-check me-1"></i> Unlimited</span>
                    <span><i class="fas fa-check me-1"></i> Priority</span>
                    <span><i class="fas fa-check me-1"></i> Analytics</span>
                </div>
                <button class="btn-select">Select Plan</button>
            </div>
            
            <!-- Business -->
            <div class="plan-row">
                <div class="plan-info">
                    <span class="plan-badge badge-business">BUSINESS</span>
                    <div class="plan-name">$79/month</div>
                    <p style="color: #64748b; font-size: 0.875rem;">For growing businesses</p>
                </div>
                <div class="plan-features">
                    <span><i class="fas fa-check text-success me-1"></i> Unlimited All</span>
                    <span><i class="fas fa-check text-success me-1"></i> Dedicated</span>
                </div>
                <button class="btn-select btn-outline">Select</button>
            </div>
        </div>
    </section>
</body>
</html>
